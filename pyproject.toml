[project]
name = "rag-backend"
version = "0.1.0"
description = "Document ingestion and conversational RAG backend"
readme = "README.md"
authors = [
    { name = "dhirajs16", email = "dhirajsa676@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-backend = "rag_backend.main:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
